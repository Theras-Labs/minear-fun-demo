[package]
name = "minear-items"
description = "MINEAR items: one NEP-245 contract for every ore, gem, soul and coin, plus trip saves, crafting, gear NFTs and the merchant market"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/Theras-Labs/minear-fun-demo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
